<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-labelledby="title">
  <title id="title">Export / Import / revision Restore</title>
  <style>
    :root { color-scheme: light dark; --rp-base: #faf4ed; --rp-text: #464261; --rp-pine: #286983; color: var(--rp-text); }
    @media (prefers-color-scheme: dark) { :root { --rp-base: #232136; --rp-text: #e0def4; --rp-pine: #9ccfd8; } }
    text { fill: currentColor; font: 22px system-ui, sans-serif; text-anchor: middle; }
    .box { fill: var(--rp-base); stroke: currentColor; stroke-width: 2; }
    .arrow { fill: none; stroke: var(--rp-pine); stroke-width: 2; marker-end: url(#arrow); }
    .small { font-size: 18px; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--rp-pine)" stroke-width="2"/></marker></defs>
  <rect width="720" height="290" rx="12" fill="var(--rp-base)"/>
  <rect class="box" x="24" y="28" width="190" height="58" rx="8"/><text x="119" y="64">honk</text>
  <path class="arrow" d="M 214 57 H 286"/>
  <rect class="box" x="288" y="28" width="190" height="58" rx="8"/><text x="383" y="64">Export</text>
  <path class="arrow" d="M 478 57 H 566"/>
  <rect class="box" x="568" y="28" width="128" height="58" rx="8"/><text x="632" y="64">*.dae ↓</text>
  <rect class="box" x="24" y="132" width="190" height="58" rx="8"/><text x="119" y="167">honk -c</text>
  <path class="arrow" d="M 214 161 H 286"/>
  <rect class="box" x="288" y="132" width="190" height="58" rx="8"/><text x="383" y="167">Import</text>
  <path class="arrow" d="M 478 161 H 566"/>
  <rect class="box" x="568" y="132" width="128" height="138" rx="8"/><text x="632" y="208">honk</text>
  <rect class="box" x="24" y="212" width="190" height="58" rx="8"/><text x="119" y="247">revision</text>
  <path class="arrow" d="M 214 241 H 286"/>
  <rect class="box" x="288" y="212" width="190" height="58" rx="8"/><text x="383" y="247">Restore</text>
  <path class="arrow" d="M 478 241 H 566"/>
</svg>
