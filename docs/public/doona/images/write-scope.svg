<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title">
  <title id="title">Hold / Apply / Save / Done</title>
  <style>
    :root { color-scheme: light dark; --rp-base: #faf4ed; --rp-text: #464261; --rp-pine: #286983; color: var(--rp-text); }
    @media (prefers-color-scheme: dark) { :root { --rp-base: #232136; --rp-text: #e0def4; --rp-pine: #9ccfd8; } }
    text { fill: currentColor; font: 22px system-ui, sans-serif; text-anchor: middle; }
    .box { fill: var(--rp-base); stroke: currentColor; stroke-width: 2; }
    .arrow { fill: none; stroke: var(--rp-pine); stroke-width: 2; marker-end: url(#arrow); }
    .small { font-size: 18px; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--rp-pine)" stroke-width="2"/></marker></defs>
  <rect width="720" height="390" rx="12" fill="var(--rp-base)"/>
  <rect class="box" x="24" y="32" width="140" height="56" rx="8"/><text x="94" y="67">Add rule</text>
  <path class="arrow" d="M 164 60 H 210"/>
  <rect class="box" x="212" y="32" width="124" height="56" rx="8"/><text x="274" y="67">Hold</text>
  <path class="arrow" d="M 336 60 H 392"/>
  <rect class="box" x="394" y="32" width="134" height="56" rx="8" stroke-dasharray="6 4"/><text x="461" y="67">session</text>
  <path class="arrow" d="M 94 88 V 166 H 210"/>
  <path class="arrow" d="M 461 88 V 114 H 274 V 136"/>
  <rect class="box" x="212" y="138" width="124" height="56" rx="8"/><text x="274" y="173">Apply</text>
  <path class="arrow" d="M 336 166 H 392"/>
  <rect class="box" x="394" y="138" width="134" height="56" rx="8"/><text x="461" y="163">*.dae</text><text class="small" x="461" y="185">1, 2, …</text>
  <path class="arrow" d="M 528 166 H 574"/>
  <rect class="box" x="576" y="138" width="120" height="56" rx="8"/><text x="636" y="173">honk</text>
  <rect class="box" x="24" y="234" width="224" height="56" rx="8"/><text x="136" y="269">runtime Apply</text>
  <path class="arrow" d="M 248 262 H 392"/>
  <rect class="box" x="394" y="234" width="302" height="56" rx="8"/><text x="545" y="269">honk runtime</text>
  <rect class="box" x="24" y="314" width="224" height="56" rx="8"/><text x="136" y="349">Save / Done</text>
  <path class="arrow" d="M 248 342 H 392"/>
  <rect class="box" x="394" y="314" width="302" height="56" rx="8"/><text x="545" y="349">localStorage</text>
</svg>
