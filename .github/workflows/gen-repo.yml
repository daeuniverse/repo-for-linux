name: Generate Linux Repo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */20 * * *"

permissions:
  contents: write

jobs:
  Build-Repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Files
        shell: bash
        run: |
          for script in $(ls downloader/*.sh); do
            bash -c "$(cat "$script")"
          done

      # # v2raya binaries are packed with UPX (maximum compression) separately,
      # # while other software packages remain uncompressed.
      - name: Compress v2raya binaries with UPX
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install upx
          for file in ./v2raya_{amd64,arm64,i386,riscv64}_v* ./v2raya_core_{amd64,arm64,i386,riscv64}_v*; do
            echo "Compressing $file ..."
            upx --best --lzma "$file"
          done

      - name: Install nfpm and jq
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install jq nfpm

      - name: Generate packages
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          for script in $(ls packager/*.sh); do
            bash -c "$(cat "$script")"
          done
      - name: Update package table
        run: |
          bash ./update-package-table.sh

      - name: Commit README to status branch
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs(status): update README [skip ci]"
          git push --force origin HEAD:status

      - name: Install reprepro gpg
        run: |
          sudo apt update
          sudo apt install -y reprepro gnupg
          sudo apt install -y createrepo-c rpm

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PRIVATE_KEY_PWD }}

      - name: Export public key
        run: |
          gpg --output public-key.asc --armor --export  ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Create Linux Repo
        run: |
          bash -c "$(cat create-repo.sh)"
          cp public-key.asc repo/public-key.asc
          npm i markdown-to-html-cli -g
          markdown-to-html --output ./repo/ README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: repo
          path: ./repo

      - name: Upload to Cloudflare
        run: |
          npm install -g wrangler
          export CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          export CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_KEY }}
          wrangler pages deploy ./repo \
            --project-name=daeuniverse \
            --branch=preview