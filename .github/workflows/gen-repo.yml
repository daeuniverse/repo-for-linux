name: Generate Linux Repo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */20 * * *"

permissions:
  contents: write

jobs:
  Build-Repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install UPX
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install upx

      - name: Install nfpm and jq
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install jq nfpm

      - name: Download Files
        shell: bash
        run: |
          for script in $(ls downloader/*.sh); do
            bash -c "$(cat "$script")"
          done

      - name: Generate packages
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          for script in $(ls packager/*.sh); do
            bash -c "$(cat "$script")"
          done
      - name: Update package table
        run: |
          bash ./update-package-table.sh

      - name: Commit README to status branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit --allow-empty -m "docs(status): update README [skip ci]"
          git push --force origin HEAD:status

      # The site and the package repository share one Cloudflare Pages deployment, so
      # build the documentation before the signing key is imported and the repository
      # is assembled. A failure here then leaves the live deployment intact.
      # A package that failed to build leaves N/A in the table, and the status branch
      # already carries it; render N/A rather than withhold the whole deployment.
      - name: Check and build documentation
        uses: ./.github/actions/documentation
        with:
          allow-missing-versions: 'true'

      - name: Install reprepro gpg
        run: |
          sudo apt update
          sudo apt install -y reprepro gnupg
          sudo apt install -y createrepo-c rpm

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PRIVATE_KEY_PWD }}

      - name: Export public key
        run: |
          gpg --output public-key.asc --armor --export ${{ steps.import_gpg.outputs.keyid }}

      - name: Create Linux Repo
        run: |
          cat create-repo.sh | sed "s/THE_REAL_GPG_PUBLIC_KEY_ID/${{ steps.import_gpg.outputs.keyid }}/g" > /tmp/create-repo-temp.sh
          bash -c "$(cat /tmp/create-repo-temp.sh)"
          cp public-key.asc repo/public-key.asc
          cat public-key.asc | gpg --dearmor -o repo/daeuniverse-archive-goose.gpg

      - name: Copy the site into the repository
        run: cp -a docs/.vitepress/dist/. repo/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: repo
          path: ./repo

      - name: Upload to Cloudflare
        run: |
          npm install -g wrangler
          export CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          export CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_KEY }}
          wrangler pages deploy ./repo \
            --project-name=daeuniverse \
            --branch=main

      - name: Clean Old Cloudflare Pages Deployments
        uses: Th3S4mur41/cleanup-cloudflare-deployments@main
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_KEY }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-project-name: daeuniverse
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cleanup-types: all
          preview-keep: 5
          production-keep: 2
          dry-run: 'false'
