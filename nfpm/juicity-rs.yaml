name: "juicity-rs"
arch: "REAL_ARCH"
platform: "linux"
version: "REAL_VERSION"
section: "default"
priority: "extra"
provides:
  - juicity-server
  - juicity-client
conflicts:
  - juicity
replaces:
  - juicity
depends:
  - v2ray-rules-dat
maintainer: "dae@daeuniverse"
description: |
  Juicity-RS is a quic-based proxy protocol implementation rewritten in Rust.
vendor: "Juicity"
homepage: "https://github.com/juicity/juicity-rs"
license: "AGPL-3.0-only"
scripts:
  postinstall: ./scripts/letsencrypt-acl.postinstall.sh
contents:
  - src: ./juicity-server_REAL_ARCH_vREAL_VERSION
    dst: /usr/bin/juicity-server
  - src: ./juicity-client_REAL_ARCH_vREAL_VERSION
    dst: /usr/bin/juicity-client
  - src: /usr/share/v2ray-rules-dat/geoip.dat
    dst: /usr/share/juicity/geoip.dat
    type: symlink
  - src: /usr/share/v2ray-rules-dat/geosite.dat
    dst: /usr/share/juicity/geosite.dat
    type: symlink
  - src: ./example/ray.json
    dst: /etc/juicity/blank.json
    type: config
  - src: ./service/juicity-rs-server.service
    dst: /lib/systemd/system/juicity-server.service
  - src: ./service/juicity-rs-client.service
    dst: /lib/systemd/system/juicity-client.service
