name: "dae"
arch: "REAL_ARCH"
platform: "linux"
version: "REAL_VERSION"
section: "default"
priority: "extra"
provides:
  - dae
depends:
  - v2ray-rules-dat
maintainer: "dae@daeuniverse"
description: |
  dae is an eBPF-based Linux high-performance transparent proxy solution.
vendor: "daeuniverse"
homepage: "https://github.com/daeuniverse/dae"
license: "AGPL-3.0-only"
scripts:
  postinstall: ./scripts/reload-systemd.postinstall.sh
  postremove: ./scripts/reload-systemd.postinstall.sh
contents:
  - src: ./dae_REAL_ARCH_vREAL_VERSION
    dst: /usr/bin/dae
  - src: /usr/share/v2ray-rules-dat/geoip.dat
    dst: /usr/share/dae/geoip.dat
    type: symlink
  - src: /usr/share/v2ray-rules-dat/geosite.dat
    dst: /usr/share/dae/geosite.dat
    type: symlink 
  - src: ./dae_example_vREAL_VERSION.dae
    dst: /etc/dae/example.dae
    type: config
    file_info:
      mode: 0644
  - src: ./dae_vREAL_VERSION.service
    dst: /lib/systemd/system/dae.service
    file_info:
      mode: 0644
